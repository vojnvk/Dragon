# Type-check, lint, test and build both apps on every push and pull request.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: npm ci
        shell: bash
        run: |
          if ! npm ci 2>&1 | tee ci.log; then
            echo "::error::$(tail -n 40 ci.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        shell: bash
        run: |
          if ! npm ci 2>&1 | tee ci.log; then
            echo "::error::$(tail -n 40 ci.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
